name: 개미탕 지수 갱신

on:
  schedule:
    - cron: "40 9 * * 1-5"    # 평일 18:40 (한국 시간) 국내 장 마감 후
    - cron: "40 22 * * 1-5"   # 화~토 07:40 (한국 시간) 미국 장 마감 후
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 수집과 지수 계산
        run: python3 scripts/update.py
      - name: 데이터 저장
        run: |
          git config user.name "gaemitang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 갱신"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
